[project]
name = "rf-detr-train"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tymoteusz Lindner", email = "tymoteusz.lindner@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "distinctipy>=1.3.4",
    "fiftyone>=1.22.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "natsort>=8.4.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyaml>=26.7.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rfdetr[train]>=1.11.1",
    "rich>=15.0.0",
    "supervision[metrics]>=0.30.6",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
